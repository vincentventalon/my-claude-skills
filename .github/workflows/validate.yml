name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Marketplace manifest
        run: claude plugin validate . --strict
      - name: Each plugin the marketplace lists
        run: |
          for d in $(jq -r '.plugins[].source' .claude-plugin/marketplace.json); do
            claude plugin validate "$d" --strict
          done
